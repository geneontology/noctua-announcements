name: Publish announcements

# Runs whenever an announcement is added, edited or removed on main.
#
# If the build step fails, the deploy step is skipped and the announcements that
# are already published stay live. A broken commit can never take the banner down.

on:
  push:
    branches: [main]
    paths:
      - 'announcements/**'
      - 'schema.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. Queue them instead of cancelling, so an
# announcement is never dropped mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ci, not install: package-lock.json is committed, so the build that
      # publishes is the one that was tested.
      - run: npm ci --no-audit --no-fund

      # Before the build, so a broken script fails here with a readable test
      # name rather than half-way through publishing.
      - name: Test
        run: npm test

      - name: Build announcements.json
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
