name: Publish announcements

# Runs whenever an announcement is added, edited or removed on dev.
#
# If the build step fails, the deploy step is skipped and the announcements that
# are already published stay live. A broken commit can never take the banner down.

on:
  push:
    branches: [dev]
    paths:
      - 'announcements/**'
      - 'schema.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. Queue them instead of cancelling, so an
# announcement is never dropped mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Build announcements.json
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
